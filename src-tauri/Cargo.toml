[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
# alc = { git = "https://github.com/sandsq/alc-rs.git" }
alc = { path = "../../alc-rs" }
# Must stay in sync with alc-rs: `Keycode` derives strum's `IntoEnumIterator`
# there, and a version mismatch makes it a different trait (`Keycode::iter()`
# then fails to resolve).
strum = "0.28.0"
strum_macros = "0.28.0"
dirs = "5.0.1"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
